<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BeachWell</title>
  <meta name="description" content="A weekly workload score, study planner and de-stress event finder for CSULB students.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='14' width='6' height='14' fill='%234F9A78'/%3E%3Crect x='13' y='8' width='6' height='20' fill='%23E07B39'/%3E%3Crect x='22' y='3' width='6' height='25' fill='%23C23B3B'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#forecast" aria-label="BeachWell home">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect x="4" y="18" width="5" height="9" rx="1.5" fill="var(--light)"/><rect x="11" y="13" width="5" height="14" rx="1.5" fill="var(--moderate)"/><rect x="18" y="8" width="5" height="19" rx="1.5" fill="var(--heavy)"/><rect x="25" y="4" width="5" height="23" rx="1.5" fill="var(--overload)"/></svg>
      <span>BeachWell</span>
    </a>
    <nav class="tabs" id="tabs" aria-label="Sections" hidden>
      <a href="#forecast" data-tab="forecast">Workload</a>
      <a href="#plan" data-tab="plan">Plan</a>
      <a href="#recharge" data-tab="recharge">Recharge</a>
      <a href="#checkin" data-tab="checkin">Check-in</a>
      <a href="#pace" data-tab="pace">My pace</a>
      <a href="#radar" data-tab="radar">Campus radar</a>
    </nav>
    <div class="who" id="who"></div>
  </header>

  <main id="main" tabindex="-1">
    <div id="view" aria-live="polite"></div>
  </main>

  <footer class="help-line">
    <p>Need to talk to someone now? Call or text <a href="tel:988">988</a>, or call CSULB CAPS at <a href="tel:5629854001">562-985-4001</a>. In an emergency, call <a href="tel:911">911</a>.</p>
    <p class="fineprint" id="modeline"></p>
  </footer>

  <dialog id="crisis" aria-labelledby="crisis-title"></dialog>
  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
